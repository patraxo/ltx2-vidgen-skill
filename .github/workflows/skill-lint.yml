name: skill-lint

# Validates every skills/<name>/SKILL.md: YAML frontmatter present, `name`
# matches the parent directory, and `description` is non-empty. Also syntax-checks
# the deploy app + the skill's submit script. Keeps the published skill installable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import glob, sys, re
          fails = []
          skills = glob.glob("skills/*/SKILL.md")
          if not skills:
              fails.append("no skills/*/SKILL.md found")
          for p in skills:
              d = p.split("/")[1]
              text = open(p, encoding="utf-8").read()
              m = re.match(r"^---\s*\n(.*?)\n---\s*\n", text, re.S)
              if not m:
                  fails.append(f"{p}: missing YAML frontmatter"); continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name:
                  fails.append(f"{p}: no `name:` field")
              elif name.group(1).strip().strip('"\'') != d:
                  fails.append(f"{p}: name '{name.group(1).strip()}' != dir '{d}'")
              if not desc or not desc.group(1).strip():
                  fails.append(f"{p}: empty/missing `description:`")
              print(f"checked {p}")
          if fails:
              print("\nFRONTMATTER ERRORS:"); [print(" -", f) for f in fails]; sys.exit(1)
          print("\nall SKILL.md frontmatter valid")
          PY

      - name: Syntax-check Python
        run: |
          python3 -m py_compile deploy/ltx2_model.py
          python3 -m py_compile skills/ltx2-video/scripts/submit_video.py
          echo "python syntax OK"

      - name: Validate plugin marketplace manifest (structural — deterministic gate)
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          p = ".claude-plugin/marketplace.json"
          mp = json.load(open(p))
          errs = []
          for k in ("name", "owner", "plugins"):
              if k not in mp:
                  errs.append(f"top-level missing `{k}`")
          for i, pl in enumerate(mp.get("plugins", [])):
              for k in ("name", "description", "source"):
                  if k not in pl:
                      errs.append(f"plugins[{i}] missing `{k}`")
              # skill-bundle entries must point at real SKILL.md dirs
              for s in pl.get("skills", []):
                  d = pathlib.Path(s.lstrip("./"))
                  if not (d / "SKILL.md").is_file():
                      errs.append(f"plugins[{i}] skill '{s}' has no SKILL.md")
          if errs:
              print("MARKETPLACE ERRORS:"); [print(" -", e) for e in errs]; sys.exit(1)
          print(f"{p} structurally valid ({len(mp['plugins'])} plugin(s))")
          PY

      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || { echo "::warning::claude CLI install failed; structural check above is the gate"; exit 0; }
          CI=true claude plugin validate . || { echo "::error::claude plugin validate failed"; exit 1; }
